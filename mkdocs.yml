# Gerado por fernando-moretes/platform (TechDocs do Backstage). O conteudo e do
# repositorio: escreva em docs/*.md; este arquivo so lista as paginas.
site_name: dot-setup-macos-developer
site_description: "macOS developer workstation setup automation for repeatable engineering environments."
repo_url: https://github.com/fernandofatech/dot-setup-macos-developer
edit_uri: edit/main/docs/
docs_dir: docs
plugins:
  - techdocs-core
nav:
  - Visão geral: index.md
